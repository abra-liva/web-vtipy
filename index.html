<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generátor vtipů</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Lora:ital,wght@0,400;1,400;1,600&display=swap');

    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --border: #2e2e3d;
      --accent: #f0c040;
      --accent-dim: rgba(240, 192, 64, 0.12);
      --text: #e8e8f0;
      --muted: #7a7a96;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header .emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      animation: wobble 3s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .header h1 span {
      color: var(--accent);
    }

    .header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.95rem;
      padding: 12px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      width: 100%;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input::placeholder { color: var(--muted); }

    .api-hint {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .api-hint a {
      color: var(--accent);
      text-decoration: none;
    }

    .api-hint a:hover { text-decoration: underline; }

    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #0f0f13;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 14px 24px;
      transition: opacity 0.2s, transform 0.1s;
      width: 100%;
    }

    button:hover:not(:disabled) { opacity: 0.88; }
    button:active:not(:disabled) { transform: scale(0.98); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .output-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .output-section.visible { display: flex; }

    .output-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .output-label .tag {
      background: var(--accent-dim);
      border: 1px solid rgba(240, 192, 64, 0.25);
      border-radius: 4px;
      color: var(--accent);
      font-size: 0.7rem;
      padding: 2px 7px;
    }

    .joke-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 22px;
      min-height: 80px;
      position: relative;
    }

    .joke-text {
      font-family: 'Lora', Georgia, serif;
      font-size: 1.1rem;
      font-style: italic;
      line-height: 1.7;
      color: var(--text);
    }

    .loading-dots {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .loading-dots.visible { display: flex; }

    .loading-dots span {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }

    .error-msg {
      background: rgba(220, 60, 60, 0.1);
      border: 1px solid rgba(220, 60, 60, 0.3);
      border-radius: 8px;
      color: #f08080;
      font-size: 0.88rem;
      padding: 12px 16px;
      display: none;
    }

    .error-msg.visible { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <span class="emoji">🤡</span>
    <h1>Generátor <span>vtipů</span></h1>
    <p>Zadej téma, dostaneš vtip.</p>
  </div>

  <div class="card">

    <div class="field">
      <label>Téma vtipu</label>
      <input id="topic" type="text" placeholder="např. programátoři, kočky, pondelok…" autocomplete="off" />
    </div>

    <div class="field">
      <label>API klíč</label>
      <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" />
      <span class="api-hint">
        Klíč najdeš na <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>. Nikam se neukládá.
      </span>
    </div>

    <button id="generateBtn" onclick="generateJoke()">Vygenerovat vtip ✨</button>

    <div class="error-msg" id="errorMsg"></div>

    <div class="divider"></div>

    <div class="output-section" id="outputSection">
      <div class="output-label">
        Výsledek
        <span class="tag">Claude</span>
      </div>
      <div class="joke-box">
        <div class="loading-dots" id="loadingDots">
          <span></span><span></span><span></span>
        </div>
        <div class="joke-text" id="jokeText"></div>
      </div>
    </div>

  </div>

  <script>
    async function generateJoke() {
      const topic = document.getElementById('topic').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const btn = document.getElementById('generateBtn');
      const outputSection = document.getElementById('outputSection');
      const loadingDots = document.getElementById('loadingDots');
      const jokeText = document.getElementById('jokeText');
      const errorMsg = document.getElementById('errorMsg');

      // Reset
      errorMsg.classList.remove('visible');
      jokeText.textContent = '';

      if (!topic) {
        showError('Zadej prosím téma vtipu.');
        return;
      }
      if (!apiKey || !apiKey.startsWith('sk-ant-')) {
        showError('Zadej platný Anthropic API klíč (začíná sk-ant-…).');
        return;
      }

      btn.disabled = true;
      outputSection.classList.add('visible');
      loadingDots.classList.add('visible');

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 500,
            temperature: 0.7,
            messages: [
              {
                role: 'user',
                content: `Jsi zkušený český humorista. Vymysli ONE krátký, vtipný vtip na téma "${topic}". Max 2-3 věty. Bez vysvětlení, jen samotný vtip. Česky.`
              }
            ]
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err?.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const joke = data?.content?.[0]?.text?.trim() || '(Vtip se nepodařilo načíst)';

        loadingDots.classList.remove('visible');
        jokeText.textContent = joke;

      } catch (err) {
        loadingDots.classList.remove('visible');
        outputSection.classList.remove('visible');
        showError('Chyba: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function showError(msg) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    // Enter key support
    document.getElementById('topic').addEventListener('keydown', e => {
      if (e.key === 'Enter') generateJoke();
    });
  </script>

</body>
</html>
